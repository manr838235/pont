        }
        if (!password || password.length < 8) {
          newErrors.password = "Password must be at least 8 characters long";

        if (password !== confirmPassword) {
          newErrors.confirmPassword = "Passwords do not match!";
        }
        if (!agreeTerms) {
          newErrors.terms = "Please tick the box to accept company security terms";
        }

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          return;

        setErrors({});
        setIsSubmitting(true);

          try {

          setAddWalletSuccess(true);
          setTimeout(() => {

                    id="crypto-banner-bg"

                          {/* Input field: Email Address */}
                          <div className="space-y-1" id="signin-field-email-container">
                            <label className="block text-[11px] font-medium text-gray-400">Email Address</label>
                            <div className="relative">
                              <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">

                              </span>

                                type="email"

                                value={email}
                                onChange={(e) => {
                                  setEmail(e.target.value);
                                  if (errors.email) setErrors(prev => ({ ...prev, email: '' }));
                                }}

                            </div>

                                  if (errors.password) setErrors(prev => ({ ...prev, password: '' }));
                                }}

                                {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                              </button>
                            </div>
                            {errors.password && (
                              <p className="text-[10px] text-red-400 flex items-center gap-1 mt-1">

                                <span>{errors.password}</span>

                            onChange={(e) => {
                              setEmail(e.target.value);
                              if (errors.email) setErrors(prev => ({ ...prev, email: '' }));
                            }}
                            placeholder="example@domain.com"
                            className="w-full bg-[#1a1d23] pl-9 pr-4 py-2 rounded-lg border border-[#2d3139] text-white placeholder-gray-600 text-xs focus:border-[#3b82f6] outline-none transition-all"

                        </div>
                        {errors.email && (
                          <p className="text-[10px] text-red-400 flex items-center gap-1 mt-1">
                            <Icons.AlertCircle className="text-red-400" />
                            <span>{errors.email}</span>
                          </p>

                              if (errors.password) setErrors(prev => ({ ...prev, password: '' }));

                          <button
                            type="button"
                            onClick={() => setShowPassword(!showPassword)}
                            className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-200"
                          >
                            {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                          </button>
                        </div>
                        {errors.password && (
                          <p className="text-[10px] text-red-400 flex items-center gap-1 mt-1">
                            <Icons.AlertCircle className="text-red-400" />
                            <span>{errors.password}</span>
                          </p>
                        )}
                      </div>

                      {/* Repeat password input */}
                      <div className="space-y-1" id="field-confirm-pwd-container">

                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <Icons.Lock />
                          </span>
                          <input
                            type={showConfirmPassword ? "text" : "password"}
                            required
                            value={confirmPassword}
                            onChange={(e) => {
                              setConfirmPassword(e.target.value);
                              if (errors.confirmPassword) setErrors(prev => ({ ...prev, confirmPassword: '' }));
                            }}
                            placeholder="Repeat passkey"
                            className="w-full bg-[#1a1d23] pl-9 pr-9 py-2 rounded-lg border border-[#2d3139] text-white placeholder-gray-600 text-xs focus:border-[#3b82f6] outline-none transition-all"

                          <button
                            type="button"
                            onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                            className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-200"
                          >
                            {showConfirmPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                          </button>
                        </div>
                        {errors.confirmPassword && (
                          <p className="text-[10px] text-red-400 flex items-center gap-1 mt-1">
                            <Icons.AlertCircle className="text-red-400" />
                            <span>{errors.confirmPassword}</span>
                          </p>
                        )}
                      </div>

                      {/* Custom Terms Check field */}
                      <div className="pt-1">
                        <label className="flex items-start gap-2 text-[11px] text-gray-400 cursor-pointer select-none">
                          <input
                            type="checkbox"
                            checked={agreeTerms}
                            onChange={(e) => {
                              setAgreeTerms(e.target.checked);
                              if (errors.terms) setErrors(prev => ({ ...prev, terms: '' }));
                            }}
                            className="mt-0.5 w-3.5 h-3.5 bg-[#1a1d23] border-[#2d3139] rounded text-blue-500 focus:ring-blue-500"
                          />
                          <span>
                            I accept the{' '}
                            <button
                              type="button"
                              onClick={() => setShowTermsModal(true)}
                              className="text-[#3b82f6] hover:underline hover:text-blue-400 font-medium ml-0.5"
                            >
                              SafePal Web3 platform rules
                            </button>
                          </span>
                        </label>
                        {errors.terms && (
                          <p className="text-[10px] text-red-400 flex items-center gap-1 mt-1">
                            <Icons.AlertCircle className="text-red-400" />
                            <span>{errors.terms}</span>
                          </p>
                        )}
                      </div>

                      {/* Submit action */}
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="w-full mt-2 bg-[#3b82f6] hover:bg-[#2563eb] active:bg-[#1d4ed8] text-white font-semibold py-2 px-4 rounded-lg shadow-md disabled:opacity-75 transition-all flex items-center justify-center gap-2 cursor-pointer text-xs"
                      >
                        {isSubmitting ? 'Securing Web3 keys...' : 'Create Account'}
                        {!isSubmitting && <Icons.ChevronRight />}
                      </button>
                    </form>

                    <div className="mt-4 p-2.5 rounded bg-blue-500/5 border border-blue-500/10 flex items-start gap-2">
                      <Icons.Info className="text-blue-400 mt-0.5 flex-shrink-0" />
                      <p className="text-[10px] text-gray-400 leading-normal">
                        We prioritize atomic security. Your passwords and private cryptographic layers remain locked and decentralized on-device.
                      </p>
                    </div>

                    <div className="mt-4 pt-4 border-t border-[#2d3139] text-center text-[11px] text-gray-500">
                      <span>Already have a SafePal account? </span>
                      <button 
                        onClick={() => {
                          setIsSignInView(true);
                          setErrors({});
                        }}
                        className="text-[#3b82f6] hover:underline font-medium cursor-pointer"
                      >
                        Sign In to Wallet
                      </button>
                    </div>
                      </div>

                </div>
              </section>

              {/* Device Frame */}
              <div className="w-full h-full lg:h-auto lg:min-h-[850px] lg:max-w-[760px] bg-[#0c0d10] border-0 lg:border border-[#1f232c] lg:rounded-3xl shadow-2xl relative overflow-hidden flex flex-col justify-between" id="responsive-wallet-frame">
                
                {/* WALLET TOP HEADER */}
                <div className="p-4 border-b border-[#1f232c] bg-[#0c0d10]" id="wallet-top-header">
                  {/* Icons row with all white icon colors */}
                  <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                      <button 
                        onClick={() => setShowQuickSettings(true)}
                        className="p-1.5 hover:bg-white/5 active:scale-95 rounded-lg text-white transition-all cursor-pointer"
                        title="Wallet Settings"
                      >
                        <Icons.Hexagon />
                      </button>
                      
                      <button 
                        onClick={() => setShowNotificationModal(true)}
                        className="p-1.5 hover:bg-white/5 active:scale-95 rounded-lg text-white transition-all relative cursor-pointer"
                        title="Notifications"
                      >
                        <Icons.Bell />
                        <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                      </button>

                      <button
                        onClick={() => setShowAddWalletModal(true)}

                      >
                        <Icons.Plus className="w-3.5 h-3.5" />
                        <span>Add Wallet</span>
                      </button>
                    </div>

                    {/* Center title or selector is empty as requested */}
                    <div className="flex flex-col items-center"></div>

                    {/* QR scanner white color icon */}
                    <div>
                      <button 
                        onClick={() => {
                          const btcCoin = receiveCoins.find(c => c.id === 'btc');
                          if (btcCoin) setSelectedCoinForDeposit(btcCoin);
                        }}
                        className="p-1.5 hover:bg-white/5 active:scale-95 rounded-lg text-white transition-all cursor-pointer"

                      >
                        <Icons.QrCode />
                      </button>
                    </div>
                  </div>

                  <div className="flex border-b border-[#1f232c] -mx-4 px-4 sticky top-0 bg-[#0c0d10] z-20">
                    {['Coin', 'Bank', 'Earn', 'NFT'].map((tab) => (
                      <button
                        key={tab}
                        onClick={() => setActiveTopTab(tab)}
                        className={`flex-1 text-center py-2 text-xs font-semibold tracking-wide transition-all uppercase cursor-pointer border-b-2 ${
                          activeTopTab === tab 
                            ? 'border-blue-500 text-white font-bold' 
                            : 'border-transparent text-gray-400 hover:text-gray-200'

                      >

                      </button>

                          </button>
                        </div>

                        {/* Thin clean zero representation */}
                        <div className="text-4xl font-normal text-white tracking-tight flex items-center justify-center font-sans my-2" id="wallet-balance-num">

                          0 BTC
                        </div>
                      </div>

                      {/* QUICK ACTION BUTTON MATRIX */}

                            <Icons.ArrowUp />
                          </button>
                          <span className="text-[11px] text-gray-300 font-medium mt-2">Send</span>
                        </div>

                        {/* Receive button with downward arrow & white icon */}

                          <button 
                            onClick={() => setShowReceiveSelector(true)}

                            <Icons.ArrowDown />
                          </button>
                          <span className="text-[11px] text-gray-300 font-medium mt-2">Receive</span>
                        </div>

                          <button 
                            onClick={() => setShowBuyModal(true)}
                            className="w-12 h-12 rounded-full bg-[#1e222b] hover:bg-indigo-500/20 border border-[#2d3139] flex items-center justify-center text-white transition-all scale-100 active:scale-95 cursor-pointer shadow-md"

                            <Icons.CreditCard />
                          </button>
                          <span className="text-[11px] text-gray-300 font-medium mt-2">Buy</span>

                    </h3>

                    <p className="text-[11px] text-gray-400 leading-normal mb-4">
                      Purchase Bitcoin, Ethereum or BNB instantly with visa or instant bank configurations with safe checkout.
                    </p>

                    <div className="space-y-2 text-xs">
                      {[
                        { provider: 'MoonPay', speed: 'Delivery in 5 min', coins: 'BTC, ETH, BNB, TRX, SOL', fee: '1.9% Fee' },
                        { provider: 'Simplex Secure', speed: 'Delivery in 10 min', coins: 'Stablecoins, BTC, ETH', fee: '2.5% Fee' }
                      ].map((p, idx) => (
                        <div 
                          key={idx} 
                          onClick={() => alert(`Redirecting secure session to checkout provider ${p.provider}.`)}
                          className="p-3 bg-[#1a1d23] hover:bg-[#20252e] border border-[#2d3139] rounded-xl flex justify-between items-center cursor-pointer transition-colors"
                        >
                          <div>
                            <p className="font-bold text-white">{p.provider}</p>
                            <p className="text-[9px] text-gray-500 mt-0.5">{p.coins}</p>
                          </div>
                          <div className="text-right text-[10px]">
                            <p className="text-emerald-400 font-bold font-mono">{p.fee}</p>
                            <p className="text-[9px] text-gray-500">{p.speed}</p>
                          </div>
                        </div>
                      ))}
                    </div>

                    <button 
                      onClick={() => setShowBuyModal(false)}
                      className="w-full mt-4 bg-[#1e222b] hover:bg-[#2d3139] text-white rounded-lg py-1.5 text-xs font-semibold cursor-pointer"
                    >
                      Back to Wallet View
                    </button>
                  </div>
                </div>
              )}

              {/* MODAL: QUICK SETTINGS OVERLAY */}
              {showQuickSettings && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in">
                  <div onClick={() => setShowQuickSettings(false)} className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
                  <div className="bg-[#0c0d10] border border-[#2d3139] rounded-xl max-w-sm w-full p-5 relative z-10 shadow-2xl animate-scale-up">
                    <button onClick={() => setShowQuickSettings(false)} className="absolute top-3 right-3 p-1 text-gray-500 hover:text-white">
                      <Icons.X />
                    </button>

                    <h3 className="text-sm font-bold text-white mb-3 flex items-center gap-2">
                      <Icons.Hexagon />
                      <span>Wallet Settings</span>
                    </h3>

                    <div className="space-y-1.5 text-xs text-left">
                      <div className="p-3 bg-white/[0.02] border border-white/5 rounded-lg flex justify-between items-center">
                        <span className="text-gray-400">Account Whitelist</span>
                        <span className="text-[10px] text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded font-mono font-bold uppercase">Biometric Verified</span>
                      </div>
                      
                      <button 
                        onClick={() => {
                          setIsRegistered(false);
                          setShowQuickSettings(false);
                          try {
                            localStorage.removeItem('safepal_session');
                          } catch (e) {
                            console.error(e);
                          }
                        }}
                        className="w-full mt-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/15 py-2 font-bold rounded-lg text-center transition-colors"
                      >
                        Disconnect Wallet & Sign Out
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          )}

          {/* GLOBAL SECURITY TERMS MODAL */}
          {showTermsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in" id="terms-modal-wrapper">
              <div onClick={() => setShowTermsModal(false)} className="absolute inset-0 bg-black/80 backdrop-blur-sm" id="modal-outside-layer"></div>
              <div className="bg-[#0c0d10] border border-[#2d3139] rounded-xl max-w-sm w-full p-5 relative z-10 shadow-2xl animate-scale-up text-left" id="modal-content-card">
                <h3 className="text-sm font-bold text-white mb-3 flex items-center gap-2 border-b border-[#2d3139] pb-2">
                  <Icons.ShieldCheck className="text-amber-500" />
                  <span>SafePal Web3 Security Guidelines</span>
                </h3>

                <div className="text-[11px] text-gray-400 space-y-3 max-h-48 overflow-y-auto pr-1 leading-relaxed">
                  <p className="font-semibold text-white text-xs">1. Absolute Decentralization</p>
                  <p>SafePal acts purely as a non-custodial gate interface connecting peer-to-peer decentralized nodes. SafePal has no capability, access or master backdoors to restore custody, passkeys or recovery seed phrases.</p>
                  
                  <p className="font-semibold text-white text-xs">2. Atomic Transactions</p>
                  <p>All on-chain broadcasts are permanent and irreversible. Always authorize and review transaction signatures explicitly prior to submitting broadcast commits on-line.</p>
                </div>

                <button
                  onClick={() => {
                    setAgreeTerms(true);
                    setShowTermsModal(false);
                  }}
                  className="w-full mt-4 bg-[#3b82f6] hover:bg-[#2563eb] text-white font-semibold py-1.5 px-4 rounded-lg text-xs cursor-pointer"
                  id="modal-close-btn"
                >
                  Close and Authorize Agreement
                </button>
              </div>
            </div>
          )}

          {showInfiniteLoading && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in">
              <div onClick={() => setShowInfiniteLoading(false)} className="absolute inset-0 bg-black/85 backdrop-blur-sm"></div>
              <div className="bg-[#0c0d10] border border-[#2d3139] rounded-2xl max-w-xs w-full p-6 relative z-10 shadow-2xl flex flex-col items-center text-center font-sans animate-scale-up" id="infinite-loader-modal">
                <button 
                  onClick={() => setShowInfiniteLoading(false)}
                  className="absolute top-4 right-4 p-1.5 text-gray-500 hover:text-white hover:bg-white/5 rounded-lg transition-colors cursor-pointer"
                  title="Close"
                >
                  <Icons.X />
                </button>

                <h4 className="text-sm font-bold text-white mb-2">Connecting to Web3 Node</h4>
                <p className="text-xs text-gray-400 mb-6">Connecting to server, please wait...</p>

                {/* Thin elegant white spinner loader */}
                <div className="w-16 h-16 border border-white/5 border-t-white rounded-full animate-spin mb-4" style={{ borderWidth: '1px' }}></div>
                
                <span className="text-[11px] text-gray-500 mt-2">Syncing peer-to-peer network nodes...</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount the React Application
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
