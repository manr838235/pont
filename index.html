<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض صورة بشكل متوسط</title>
    <style>
        /* تنسيق الصفحة لجعل المحتوى في المنتصف تماماً */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9; /* خلفية رمادية فاتحة ومريحة */
            font-family: sans-serif;
        }

        /* حاوية الصورة لإضافة تأثير جمالي (ظل وإطار) */
        .image-container {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 90%; /* لضمان عدم خروج الصورة عن الشاشة في الموبايل */
            text-align: center;
        }

        /* تنسيق الصورة لتكون بحجم متوسط ومتجاوب */
        .responsive-image {
            max-width: 500px; /* أقصى عرض للصورة لتظل متوسطة الحجم */
            width: 100%;      /* تجعل الصورة تصغر تلقائياً على الشاشات الصغيرة */
            height: auto;     /* الحفاظ على أبعاد الصورة دون تشويه */
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- حاوية الصورة -->
    <div class="image-container">
        <img src="https://i.pinimg.com/736x/6e/1b/eb/6e1bebe30fd4cd1c12c7e1278d1a9b3a.jpg" alt="صورة منسقة" class="responsive-image">
    </div>

</body>
</html>
